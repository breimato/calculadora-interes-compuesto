<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var storedTheme = localStorage.getItem('calculadora-interes-compuesto-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme =
          storedTheme === 'dark' || storedTheme === 'light'
            ? storedTheme
            : prefersDark
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
